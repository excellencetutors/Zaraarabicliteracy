<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanween Pop - Zara’s Arabic Literacy</title>
    <style>
        :root {
            --bg-dark: #0d1b2a;
            --card-bg: #1b263b;
            --accent-gold: #ffb703;
            --accent-green: #06d6a0;
            --accent-pink: #ef476f;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* HEADER & SCORE BAR */
        .game-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
        }

        .score-board {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        /* CONTROL BAR */
        .control-bar {
            margin: 15px 0;
            z-index: 10;
            text-align: center;
        }

        .audio-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 auto;
        }

        .audio-btn:active { transform: scale(0.95); }

        /* SKY ARENA (BALLOON CONTAINER) */
        .sky-arena {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 65vh;
            background: linear-gradient(180deg, #1b263b 0%, #0d1b2a 100%);
            border-radius: 24px;
            border: 3px solid rgba(255,255,255,0.08);
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        /* FLOATING BALLOONS */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 85px;
            height: 105px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            color: #fff;
            cursor: pointer;
            user-select: none;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        /* Balloon Strings */
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            width: 2px;
            height: 15px;
            background: rgba(255, 255, 255, 0.5);
        }

        .pop-effect {
            animation: pop 0.2s forwards;
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="game-header">
        <a href="index.html" class="back-btn">⬅ Menu</a>
        <div class="score-board">⭐ Score: <span id="score">0</span></div>
    </div>

    <div class="control-bar">
        <button class="audio-btn" onclick="playTargetAudio()">🔊 Listen to Target Sound</button>
    </div>

    <div class="sky-arena" id="sky">
        </div>

    <script>
        // Tanween Stage Data (Nurul Bayan)
        const tanweenList = [
            { sound: "Baa with Fathatain (Ban)", symbol: "بً" },
            { sound: "Baa with Kasratain (Bin)", symbol: "بٍ" },
            { sound: "Baa with Dammatain (Bun)", symbol: "بٌ" },
            { sound: "Taa with Fathatain (Tan)", symbol: "تً" },
            { sound: "Taa with Kasratain (Tin)", symbol: "تٍ" },
            { sound: "Taa with Dammatain (Tun)", symbol: "تٌ" }
        ];

        const balloonColors = ['#ef476f', '#06d6a0', '#118ab2', '#ffd166', '#9d4edd'];

        let currentTarget = null;
        let score = 0;
        let spawnInterval = null;

        function setNextTarget() {
            // Pick random target sound
            const randomIndex = Math.floor(Math.random() * tanweenList.length);
            currentTarget = tanweenList[randomIndex];
            playTargetAudio();
        }

        function playTargetAudio() {
            if (!currentTarget) return;
            const utterance = new SpeechSynthesisUtterance(currentTarget.sound);
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        function spawnBalloon() {
            const sky = document.getElementById('sky');
            const balloon = document.createElement('div');
            
            // Random item from Tanween list
            const randomItem = tanweenList[Math.floor(Math.random() * tanweenList.length)];
            const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];

            balloon.className = 'balloon';
            balloon.style.backgroundColor = color;
            balloon.innerText = randomItem.symbol;

            // Random horizontal position inside sky container
            const maxLeft = sky.clientWidth - 90;
            const randomLeft = Math.floor(Math.random() * Math.max(maxLeft, 50));
            balloon.style.left = `${randomLeft}px`;

            // Balloon click logic
            balloon.onclick = () => {
                if (randomItem.symbol === currentTarget.symbol) {
                    // Correct pop!
                    balloon.classList.add('pop-effect');
                    score += 10;
                    document.getElementById('score').innerText = score;
                    setTimeout(() => balloon.remove(), 200);
                    
                    // Advance to next prompt
                    setTimeout(setNextTarget, 600);
                } else {
                    // Wrong balloon click
                    balloon.style.transform = 'scale(0.8)';
                    setTimeout(() => balloon.style.transform = 'scale(1)', 200);
                }
            };

            sky.appendChild(balloon);

            // Animate Balloon upward
            let pos = -100;
            const speed = 1.5 + Math.random(); // Float speed
            const floatAnim = setInterval(() => {
                if (pos > sky.clientHeight + 100) {
                    clearInterval(floatAnim);
                    if (balloon.parentNode) balloon.remove();
                } else {
                    pos += speed;
                    balloon.style.bottom = `${pos}px`;
                }
            }, 20);
        }

        function startGame() {
            setNextTarget();
            // Spawn a new balloon every 2 seconds
            spawnInterval = setInterval(spawnBalloon, 2000);
        }

        window.onload = startGame;
    </script>
</body>
</html>
