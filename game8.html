<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 8: Sun & Moon Letters - Zara’s Arabic Literacy</title>
    <style>
        :root {
            --bg-dark: #0d1b2a;
            --card-bg: #1b263b;
            --accent-gold: #ffb703;
            --accent-green: #06d6a0;
            --accent-red: #ef476f;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* HEADER & NAVIGATION */
        .header-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .score-badge {
            background: rgba(255, 183, 3, 0.15);
            border: 2px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
        }

        .mute-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mute-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .mute-btn.muted {
            background: rgba(239, 71, 111, 0.2);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        /* GAME CONTAINER */
        .game-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .level-title {
            color: var(--accent-gold);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .instruction {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        /* AUDIO BUTTON & ARABIC WORD DISPLAY */
        .audio-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.3);
            transition: transform 0.2s;
            margin-bottom: 15px;
        }

        .audio-btn:active { transform: scale(0.95); }

        .arabic-display {
            font-family: 'Traditional Arabic', 'Amiri', serif;
            font-size: 4rem;
            margin-bottom: 30px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
        }

        /* OPTIONS GRID */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: var(--white);
            padding: 20px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .option-btn:hover {
            border-color: var(--accent-gold);
            background: rgba(255, 183, 3, 0.1);
            transform: translateY(-2px);
        }

        .option-btn .key-badge {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 0.75rem;
            color: #64748b;
            font-family: sans-serif;
        }

        .option-btn.correct {
            background: rgba(6, 214, 160, 0.2) !important;
            border-color: var(--accent-green) !important;
            color: var(--accent-green) !important;
        }

        .option-btn.wrong {
            background: rgba(239, 71, 111, 0.2) !important;
            border-color: var(--accent-red) !important;
            color: var(--accent-red) !important;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* VICTORY MODAL */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 27, 42, 0.95);
            border-radius: 24px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .modal-overlay.active { display: flex; }

        .modal-title {
            font-size: 2rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        .modal-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="back-btn">⬅ Menu</a>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="mute-btn" id="mute-btn" onclick="toggleMute()">🔊 Sound On</button>
            <div class="score-badge">⭐ Score: <span id="score">0</span></div>
        </div>
    </div>

    <div class="game-card">
        <div class="level-title">Level 8 — Tajweed Rules</div>
        <p class="instruction">Is the following word a Sun Letter (شمسية) or Moon Letter (قمرية)?</p>

        <button class="audio-btn" onclick="playWordAudio()">🔊</button>

        <div class="arabic-display" id="word-display">الشَّمْسُ</div>

        <div class="options-grid">
            <button class="option-btn" id="btn-sun" onclick="checkAnswer('sun', this)">
                <span class="key-badge">1 / S</span>
                <span>☀️ Sun Letter</span>
                <span style="font-size: 0.9rem; opacity: 0.8;">(حرف شمسي)</span>
            </button>
            <button class="option-btn" id="btn-moon" onclick="checkAnswer('moon', this)">
                <span class="key-badge">2 / M</span>
                <span>🌙 Moon Letter</span>
                <span style="font-size: 0.9rem; opacity: 0.8;">(حرف قمري)</span>
            </button>
        </div>

        <!-- Completion Modal -->
        <div class="modal-overlay" id="victory-modal">
            <div class="modal-title">🎉 Fantastic Job!</div>
            <p style="font-size: 1.2rem; margin-bottom: 10px;">You mastered Sun and Moon Letters!</p>
            <p style="color: var(--accent-gold); font-size: 1.4rem;">Final Score: <span id="final-score">0</span></p>
            <button class="modal-btn" onclick="restartGame()">Play Again 🔄</button>
        </div>
    </div>

    <!-- SOUND SYNTHESIZER MODULE -->
    <script src="sound.js"></script>

    <script>
        const questions = [
            { word: "الشَّمْسُ", type: "sun" },
            { word: "الْقَمَرُ", type: "moon" },
            { word: "التِّينُ", type: "sun" },
            { word: "الْبَابُ", type: "moon" },
            { word: "الرَّحْمٰنُ", type: "sun" },
            { word: "الْكِتَابُ", type: "moon" },
            { word: "الصَّلاَةُ", type: "sun" },
            { word: "الْعِلْمُ", type: "moon" }
        ];

        let currentIndex = 0;
        let score = 0;
        let canClick = true;
        let isMuted = false;

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('mute-btn');
            if (isMuted) {
                btn.innerText = "🔇 Sound Off";
                btn.classList.add('muted');
                window.speechSynthesis.cancel();
            } else {
                btn.innerText = "🔊 Sound On";
                btn.classList.remove('muted');
            }
        }

        function playWordAudio() {
            if (isMuted) return;

            window.speechSynthesis.cancel();
            const q = questions[currentIndex];
            const utterance = new SpeechSynthesisUtterance(q.word);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.8;

            try {
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.warn("Speech synthesis audio failed:", e);
            }
        }

        function loadQuestion() {
            const q = questions[currentIndex];
            document.getElementById('word-display').innerText = q.word;

            // Reset button visual state
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.classList.remove('correct', 'wrong');
            });

            canClick = true;
            playWordAudio();
        }

        function checkAnswer(selectedType, btnElement) {
            if (!canClick) return;

            const q = questions[currentIndex];

            if (selectedType === q.type) {
                canClick = false;

                if (!isMuted && typeof playCorrectSound === 'function') {
                    playCorrectSound();
                }

                btnElement.classList.add('correct');
                score += 10;
                document.getElementById('score').innerText = score;

                saveGameScore(8, score);

                setTimeout(() => {
                    currentIndex++;
                    if (currentIndex < questions.length) {
                        loadQuestion();
                    } else {
                        showVictoryScreen();
                    }
                }, 1000);

            } else {
                if (!isMuted && typeof playWrongSound === 'function') {
                    playWrongSound();
                }

                btnElement.classList.add('wrong');
                setTimeout(() => {
                    btnElement.classList.remove('wrong');
                }, 600);
            }
        }

        function saveGameScore(gameNum, newScore) {
            const currentBest = parseInt(localStorage.getItem(`arabic_game_${gameNum}_score`) || '0', 10);
            if (newScore > currentBest) {
                localStorage.setItem(`arabic_game_${gameNum}_score`, newScore);
            }
        }

        function showVictoryScreen() {
            document.getElementById('final-score').innerText = score;
            document.getElementById('victory-modal').classList.add('active');
        }

        function restartGame() {
            document.getElementById('victory-modal').classList.remove('active');
            currentIndex = 0;
            score = 0;
            document.getElementById('score').innerText = score;
            loadQuestion();
        }

        // Keyboard Shortcuts (1 / S for Sun, 2 / M for Moon, Space for Audio)
        document.addEventListener('keydown', (e) => {
            if (!canClick) return;

            const key = e.key.toLowerCase();
            if (key === '1' || key === 's') {
                checkAnswer('sun', document.getElementById('btn-sun'));
            } else if (key === '2' || key === 'm') {
                checkAnswer('moon', document.getElementById('btn-moon'));
            } else if (e.code === 'Space') {
                e.preventDefault();
                playWordAudio();
            }
        });

        window.onload = () => {
            score = parseInt(localStorage.getItem('arabic_game_8_score') || '0', 10);
            document.getElementById('score').innerText = score;
            loadQuestion();
        };
    </script>
</body>
</html>
