<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printable Worksheet Generator - Zara’s Arabic Literacy</title>
    <style>
        :root {
            --bg-dark: #0d1b2a;
            --card-bg: #1b263b;
            --accent-gold: #ffb703;
            --accent-green: #06d6a0;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* HEADER & CONTROLS */
        .page-header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back-btn, .print-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .print-btn {
            background: var(--accent-gold);
            color: #000;
        }

        .print-btn:hover {
            background: #e0a200;
        }

        /* GENERATOR CONTROL PANEL */
        .control-panel {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            border: 2px solid rgba(255,255,255,0.05);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.9rem;
            color: #cbd5e1;
            font-weight: bold;
        }

        .control-group select, .control-group input {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: var(--white);
            font-size: 1rem;
        }

        /* PRINTABLE WORKSHEET CANVAS (SCREEN PREVIEW) */
        .worksheet-paper {
            background: #ffffff;
            color: #000000;
            width: 100%;
            max-width: 800px;
            min-height: 1000px;
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .ws-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .ws-title-block h2 {
            font-size: 1.8rem;
            color: #000;
            margin-bottom: 5px;
        }

        .ws-title-block p {
            font-size: 0.95rem;
            color: #555;
        }

        .ws-meta-fields {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.95rem;
            text-align: right;
        }

        .ws-meta-line {
            border-bottom: 1px solid #000;
            width: 180px;
            display: inline-block;
        }

        /* WORKSHEET GRID ITEMS */
        .ws-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 10px;
        }

        .ws-item {
            border: 1px dashed #ccc;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            direction: rtl;
        }

        .ws-arabic-prompt {
            font-family: 'Traditional Arabic', 'Amiri', serif;
            font-size: 3rem;
            font-weight: bold;
        }

        .ws-answer-box {
            width: 120px;
            height: 50px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #fafafa;
        }

        /* PRINT STYLES - STRIPS AWAY ALL UI CONTROL ELEMENTS */
        @media print {
            body {
                background: #fff !important;
                padding: 0 !important;
            }

            .page-header, .control-panel {
                display: none !important;
            }

            .worksheet-paper {
                box-shadow: none !important;
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
                border-radius: 0 !important;
            }

            @page {
                size: A4;
                margin: 20mm;
            }
        }
    </style>
</head>
<body>

    <div class="page-header">
        <a href="index.html" class="back-btn">⬅ Menu</a>
        <button class="print-btn" onclick="window.print()">🖨️ Print Worksheet</button>
    </div>

    <!-- WORKSHEET CONTROLS -->
    <div class="control-panel">
        <div class="control-group">
            <label for="topic-select">Worksheet Topic:</label>
            <select id="topic-select" onchange="generateWorksheet()">
                <option value="harakat">Short Vowels (Harakat)</option>
                <option value="tanween">Tanween Identification</option>
                <option value="madd">Madd Long Vowels</option>
                <option value="sukoon">Sukoon Identification</option>
            </select>
        </div>

        <div class="control-group">
            <label for="item-count">Number of Questions:</label>
            <select id="item-count" onchange="generateWorksheet()">
                <option value="6">6 Questions</option>
                <option value="8" selected>8 Questions</option>
                <option value="10">10 Questions</option>
            </select>
        </div>
    </div>

    <!-- PRINTABLE PAPER AREA -->
    <div class="worksheet-paper">
        <div class="ws-header">
            <div class="ws-title-block">
                <h2 id="ws-heading">Arabic Phonics Practice</h2>
                <p id="ws-subheading">Zara’s Arabic Literacy — Practice Worksheet</p>
            </div>
            <div class="ws-meta-fields">
                <div>Name: <span class="ws-meta-line"></span></div>
                <div>Date: <span class="ws-meta-line"></span></div>
                <div>Score: <span class="ws-meta-line"></span></div>
            </div>
        </div>

        <div class="ws-grid" id="worksheet-grid">
            <!-- Dynamic exercise items -->
        </div>
    </div>

    <script>
        const dataset = {
            harakat: [
                { symbol: "بَ", label: "Write the Vowel Name" },
                { symbol: "تِ", label: "Write the Vowel Name" },
                { symbol: "ثُ", label: "Write the Vowel Name" },
                { symbol: "جَ", label: "Write the Vowel Name" },
                { symbol: "حِ", label: "Write the Vowel Name" },
                { symbol: "خُ", label: "Write the Vowel Name" },
                { symbol: "دَ", label: "Write the Vowel Name" },
                { symbol: "ذِ", label: "Write the Vowel Name" },
                { symbol: "رُ", label: "Write the Vowel Name" },
                { symbol: "زَ", label: "Write the Vowel Name" }
            ],
            tanween: [
                { symbol: "بً", label: "Identify Tanween Type" },
                { symbol: "تٍ", label: "Identify Tanween Type" },
                { symbol: "ثٌ", label: "Identify Tanween Type" },
                { symbol: "جً", label: "Identify Tanween Type" },
                { symbol: "حٍ", label: "Identify Tanween Type" },
                { symbol: "خٌ", label: "Identify Tanween Type" },
                { symbol: "دً", label: "Identify Tanween Type" },
                { symbol: "ذٍ", label: "Identify Tanween Type" }
            ],
            madd: [
                { symbol: "با", label: "Identify Madd Letter" },
                { symbol: "بو", label: "Identify Madd Letter" },
                { symbol: "بي", label: "Identify Madd Letter" },
                { symbol: "تا", label: "Identify Madd Letter" },
                { symbol: "تو", label: "Identify Madd Letter" },
                { symbol: "تي", label: "Identify Madd Letter" },
                { symbol: "جا", label: "Identify Madd Letter" },
                { symbol: "جو", label: "Identify Madd Letter" }
            ],
            sukoon: [
                { symbol: "مَنْ", label: "Circle the Sukoon Letter" },
                { symbol: "قُمْ", label: "Circle the Sukoon Letter" },
                { symbol: "هَلْ", label: "Circle the Sukoon Letter" },
                { symbol: "عَنْ", label: "Circle the Sukoon Letter" },
                { symbol: "كَمْ", label: "Circle the Sukoon Letter" },
                { symbol: "لَمْ", label: "Circle the Sukoon Letter" }
            ]
        };

        function generateWorksheet() {
            const topic = document.getElementById('topic-select').value;
            const count = parseInt(document.getElementById('item-count').value, 10);
            
            const grid = document.getElementById('worksheet-grid');
            grid.innerHTML = '';

            const items = dataset[topic].slice(0, count);

            items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'ws-item';
                card.innerHTML = `
                    <div class="ws-arabic-prompt">${item.symbol}</div>
                    <div class="ws-answer-box"></div>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = generateWorksheet;
    </script>
</body>
</html>
