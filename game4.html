<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madd & Tajweed Rules - Zara’s Arabic Literacy</title>
    <style>
        :root {
            --bg-dark: #0d1b2a;
            --card-bg: #1b263b;
            --accent-gold: #ffb703;
            --accent-green: #06d6a0;
            --accent-red: #ef476f;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* HEADER & SCORE BAR */
        .game-header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
        }

        .score-board {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        /* ARENA */
        .arena {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 3px solid rgba(255,255,255,0.05);
        }

        .instruction {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        /* AUDIO RECITATION BUTTON */
        .audio-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.3);
            margin-bottom: 25px;
        }

        .audio-btn:active { transform: scale(0.95); }

        /* QURANIC WORD DISPLAY */
        .quran-word-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px 15px;
            margin-bottom: 30px;
        }

        .quran-word {
            font-size: 4rem;
            font-family: 'Traditional Arabic', 'Amiri', serif;
            color: var(--white);
            letter-spacing: 2px;
        }

        /* RULE OPTIONS GRID */
        .options-label {
            font-size: 1rem;
            color: #a3b18a;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .rule-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 1.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .rule-card:hover {
            border-color: var(--accent-gold);
            background: rgba(255, 183, 3, 0.1);
        }

        .arabic-type {
            font-family: 'Traditional Arabic', 'Amiri', serif;
            font-size: 1.8rem;
            color: var(--accent-gold);
        }

        /* FEEDBACK STATES */
        .correct {
            background: var(--accent-green) !important;
            color: #000 !important;
            border-color: var(--accent-green) !important;
        }

        .correct .arabic-type {
            color: #000 !important;
        }

        .wrong {
            background: var(--accent-red) !important;
            border-color: var(--accent-red) !important;
        }
    </style>
</head>
<body>

    <div class="game-header">
        <a href="index.html" class="back-btn">⬅ Menu</a>
        <div class="score-board">⭐ Score: <span id="score">0</span></div>
    </div>

    <div class="arena">
        <div class="instruction">Listen to the word and identify the Madd rule!</div>
        
        <button class="audio-btn" onclick="playWordRecitation()">🔊 Listen Recitation</button>

        <div class="quran-word-box">
            <div class="quran-word" id="word-display">قَالَ</div>
        </div>

        <div class="options-label">Which long vowel (Madd) is in this word?</div>
        
        <div class="options-grid" id="options-container">
            <!-- Dynamic option buttons -->
        </div>
    </div>

    <script>
        // Madd Stage Questions (Nurul Bayan Standard)
        const maddQuestions = [
            {
                word: "قَالَ",
                soundText: "Qaa la",
                correct: "Madd Alif",
                options: [
                    { name: "Madd Alif", symbol: "مَدّ الأَلِف (َا)" },
                    { name: "Madd Ya", symbol: "مَدّ اليَاء (ِي)" },
                    { name: "Madd Waw", symbol: "مَدّ الوَاو (ُو)" }
                ]
            },
            {
                word: "قِيلَ",
                soundText: "Qee la",
                correct: "Madd Ya",
                options: [
                    { name: "Madd Alif", symbol: "مَدّ الأَلِف (َا)" },
                    { name: "Madd Ya", symbol: "مَدّ اليَاء (ِي)" },
                    { name: "Madd Waw", symbol: "مَدّ الوَاو (ُو)" }
                ]
            },
            {
                word: "يَقُولُ",
                soundText: "Ya qoo lu",
                correct: "Madd Waw",
                options: [
                    { name: "Madd Alif", symbol: "مَدّ الأَلِف (َا)" },
                    { name: "Madd Ya", symbol: "مَدّ اليَاء (ِي)" },
                    { name: "Madd Waw", symbol: "مَدّ الوَاو (ُو)" }
                ]
            },
            {
                word: "كِتَابٌ",
                soundText: "Ki taa bun",
                correct: "Madd Alif",
                options: [
                    { name: "Madd Alif", symbol: "مَدّ الأَلِف (َا)" },
                    { name: "Madd Ya", symbol: "مَدّ اليَاء (ِي)" },
                    { name: "Madd Waw", symbol: "مَدّ الوَاو (ُو)" }
                ]
            }
        ];

        let currentIndex = 0;
        let score = 0;

        function loadQuestion() {
            const q = maddQuestions[currentIndex];
            document.getElementById('word-display').innerText = q.word;

            playWordRecitation();

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach(opt => {
                const card = document.createElement('div');
                card.className = 'rule-card';
                card.innerHTML = `
                    <span>${opt.name}</span>
                    <span class="arabic-type">${opt.symbol}</span>
                `;
                card.onclick = () => checkAnswer(opt.name, card);
                container.appendChild(card);
            });
        }

        function playWordRecitation() {
            const q = maddQuestions[currentIndex];
            const utterance = new SpeechSynthesisUtterance(q.soundText);
            utterance.rate = 0.8; // Slower rate for Tajweed clarity
            window.speechSynthesis.speak(utterance);
        }

        function checkAnswer(selectedRule, cardElement) {
            const q = maddQuestions[currentIndex];

            if (selectedRule === q.correct) {
                cardElement.classList.add('correct');
                score += 10;
                document.getElementById('score').innerText = score;

                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % maddQuestions.length;
                    loadQuestion();
                }, 1000);
            } else {
                cardElement.classList.add('wrong');
                setTimeout(() => {
                    cardElement.classList.remove('wrong');
                }, 500);
            }
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
